# Desktop releases live on the Client repository, not here.
#
# Hub (this repo): https://github.com/Farhadrzi/rahbaz
# Client:          https://github.com/Farhadrzi/rahbaz-client
#
# Tag v*.*.* on Farhadrzi/rahbaz-client (or run its "Desktop release" workflow)
# to build Windows x64, Linux x64, macOS arm64, and macOS x64 installers.

name: desktop-release-pointer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  point:
    name: Client releases are separate
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "RahBaz Hub does not build the desktop Client."
          echo "Use https://github.com/Farhadrzi/rahbaz-client/actions/workflows/desktop-release.yml"
          echo "or push a v*.*.* tag on Farhadrzi/rahbaz-client."
