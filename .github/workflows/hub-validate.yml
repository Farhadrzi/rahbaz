# Hub validation — no secrets, no live OAuth.

name: hub-validate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    name: Compose config lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker Compose plugin
        run: docker compose version

      - name: Prepare non-secret compose inputs
        run: |
          cp .env.example .env
          cp config/config.example.yaml config/config.yaml
          mkdir -p auths logs/cliproxy plugins

      - name: Validate compose file
        run: docker compose -f compose.yaml config --quiet

      - name: Show resolved service names (no secrets)
        run: docker compose -f compose.yaml config --services
